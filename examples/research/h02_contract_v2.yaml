family_id: h02_contract_v2
hypothesis: "H02: 寄付レンジ突破後、期限内にレンジ内へ帰還する動きを逆張りする。"
factory: n225m_bt.strategies.opening_range_failure:create_strategy
implementation_required: false
dataset: center-auto-v1
uses: [opening_range_failure_h02_v2, session_clock, fixed_range, tick_bracket]
parameters:
  tick_size: 5
  sessions_path: config/sessions.yaml
  max_entry_signals_per_session: 1
  monitor_minutes: 120
space:
  opening_minutes: [15, 30, 60]
  breakout_fraction: [0.05, 0.15]
  return_minutes: [3, 5, 10]
  stop_fraction: [0.25, 0.5]
  reward_multiple: [1, 2]
  direction: [long, short]
backtest:
  mode: day_only
  fees.jpy_per_side_per_contract: 100
backtest_space:
  execution.slippage_ticks: [0, 1, 2]
