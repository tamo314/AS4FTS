# Copy to research_agents.local.yaml. Use the already installed/authenticated CLIs.
# Set each role.model below; no AS4FTS_*_MODEL environment variables are required.
# null uses that CLI's configured default. Set explicit IDs to separate model costs.
campaign_id: starter_research_v1
dataset: demo
initial_family: examples/research/starter_breakout.yaml
objective: >-
  Start with the supplied simple range-breakout family. Evaluate the entire parameter
  surface before designing the next strategy family. Reuse the shared components;
  do not split minor parameter changes into separate design/implementation loops.
max_families: 2  # Includes the prepared first family; the next family uses the AI roles.
workers: 2
max_repairs: 2
context_families: 3
# Optional: a timeout PAUSES the batch; it never reduces the declared parameter space.
# batch_timeout_seconds: 3600
roles:
  designer:
    model: gpt-5.6-sol  # Replace null with "your actual high-cost model ID".
    argv: ['C:\Users\tamot\AppData\Roaming\npm\codex.CMD', exec, --sandbox, read-only, --model, '{model}', -o, '{output}', '-']
    stdin: true
    timeout_seconds: 7200
  implementer:
    model: sonnet
    argv:
      - claude
      - '-p'
      - --model
      - '{model}'
      - --input-format
      - text
      - --output-format
      - json
    stdin: true
    stdin_format: text
    timeout_seconds: 7200
# Use your configured Antigravity command/wrapper by replacing argv; keep {model}
# where the CLI accepts its model ID. No CLI installation or login is performed.
# To let AI design from the very first family, set initial_family: null.
defaults:
  backtest:
    mode: day_only
    fees.jpy_per_side_per_contract: 100  # Example, not a verified broker fee.
  backtest_space:
    execution.slippage_ticks: [0, 1]
